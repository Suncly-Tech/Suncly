<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1125" width="1500" height="1125">
  <!-- Analemma. The figure of eight the sun traces when recorded at the same hour every day, as small brass discs pinned to a plaster wall, each with its own shadow. -->
  <defs>
    <linearGradient id="plaster" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F1E3"/><stop offset="1" stop-color="#EBE2CD"/></linearGradient>
    <radialGradient id="sunlight" cx="1.05" cy="-0.1" r="1.2"><stop offset="0" stop-color="#F2C14E" stop-opacity="0.5"/><stop offset="0.5" stop-color="#F2C14E" stop-opacity="0.12"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient>
    <radialGradient id="brass" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FBE2A0"/><stop offset="0.45" stop-color="#E0B04E"/><stop offset="1" stop-color="#9A6420"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer></filter>
    <!-- one disc with its shadow and pin; reused 36 times along the lemniscate -->
    <g id="disc">
      <ellipse cx="-14" cy="34" rx="22" ry="9" fill="#6E4D22" fill-opacity="0.35" filter="url(#soft)" transform="rotate(18.4)"/>
      <circle r="21" fill="url(#brass)"/>
      <circle r="21" fill="none" stroke="#7A4E18" stroke-opacity="0.5" stroke-width="1"/>
      <circle r="2.2" fill="#3A2A18"/>
    </g>
  </defs>
  <rect width="1500" height="1125" fill="url(#plaster)"/>
  <rect width="1500" height="1125" fill="url(#sunlight)"/>
  <!-- a faint pencil line of the figure, as if laid out before pinning -->
  <path d="M750 150 C 1060 150, 1060 560, 750 560 C 440 560, 440 970, 750 970 C 1060 970, 1060 560, 750 560 C 440 560, 440 150, 750 150 Z" fill="none" stroke="#1B1814" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 6"/>
  <!-- the discs, placed by a lemniscate of Bernoulli-like figure: upper lobe smaller, lower larger -->
  <g>
    <use href="#disc" x="750" y="155"/>
    <use href="#disc" x="818" y="168"/>
    <use href="#disc" x="874" y="205"/>
    <use href="#disc" x="906" y="262"/>
    <use href="#disc" x="910" y="328"/>
    <use href="#disc" x="886" y="392"/>
    <use href="#disc" x="840" y="448"/>
    <use href="#disc" x="786" y="505"/>
    <use href="#disc" x="750" y="560"/>
    <use href="#disc" x="706" y="618"/>
    <use href="#disc" x="650" y="680"/>
    <use href="#disc" x="598" y="748"/>
    <use href="#disc" x="570" y="822"/>
    <use href="#disc" x="580" y="896"/>
    <use href="#disc" x="632" y="952"/>
    <use href="#disc" x="705" y="972"/>
    <use href="#disc" x="780" y="972"/>
    <use href="#disc" x="856" y="952"/>
    <use href="#disc" x="912" y="896"/>
    <use href="#disc" x="926" y="822"/>
    <use href="#disc" x="900" y="748"/>
    <use href="#disc" x="846" y="680"/>
    <use href="#disc" x="794" y="618"/>
    <use href="#disc" x="714" y="505"/>
    <use href="#disc" x="660" y="448"/>
    <use href="#disc" x="614" y="392"/>
    <use href="#disc" x="590" y="328"/>
    <use href="#disc" x="594" y="262"/>
    <use href="#disc" x="626" y="205"/>
    <use href="#disc" x="682" y="168"/>
  </g>
  <rect width="1500" height="1125" filter="url(#grain)"/>
</svg>
