# Local development of the hosted product. Nothing here is a production setting:
# local authentication is on, the Runner may reach loopback targets, billing is the
# in-memory fake, and the model judge is off unless ANTHROPIC_API_KEY is exported.
#
#   docker compose up --build
#   suncly auth local-token --subject dev-1 --email dev@example.test   # with the same secret
#
# The frontend (Next.js) runs outside compose: `npm --prefix frontend run dev`.

services:
  db:
    image: postgres:17.2-bookworm
    environment:
      POSTGRES_USER: suncly
      POSTGRES_PASSWORD: suncly-local-only
      POSTGRES_DB: suncly
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suncly -d suncly"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql://suncly:suncly-local-only@db:5432/suncly
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["api"]
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://suncly:suncly-local-only@db:5432/suncly
      SUNCLY_ENVIRONMENT: development
      SUNCLY_NETWORK_MODE: local
      SUNCLY_LOCAL_AUTH_ENABLED: "1"
      SUNCLY_LOCAL_AUTH_SECRET: ${SUNCLY_LOCAL_AUTH_SECRET:-local-dev-secret-change-me-please}
      SUNCLY_BILLING_PROVIDER: fake
      SUNCLY_CORS_ORIGINS: http://localhost:3100,http://localhost:3000
      SUNCLY_PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - evidence:/var/suncly

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql://suncly:suncly-local-only@db:5432/suncly
      SUNCLY_ENVIRONMENT: development
      SUNCLY_NETWORK_MODE: local
      SUNCLY_LOCAL_AUTH_ENABLED: "1"
      SUNCLY_LOCAL_AUTH_SECRET: ${SUNCLY_LOCAL_AUTH_SECRET:-local-dev-secret-change-me-please}
      SUNCLY_BILLING_PROVIDER: fake
      SUNCLY_MODEL_PROVIDER: ${SUNCLY_MODEL_PROVIDER:-}
      SUNCLY_MODEL: ${SUNCLY_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUNCLY_A2A_TCK_DIR: /opt/a2a-tck
      # The agent credential for a registration with credential provider "env":
      SANDBOX_AGENT_TOKEN: ${SANDBOX_AGENT_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - evidence:/var/suncly

  dispatcher:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    entrypoint: ["sh", "-c", "while true; do suncly worker tick || true; sleep 30; done"]
    environment:
      DATABASE_URL: postgresql://suncly:suncly-local-only@db:5432/suncly
      SUNCLY_ENVIRONMENT: development
      SUNCLY_NETWORK_MODE: local
      SUNCLY_LOCAL_AUTH_ENABLED: "1"
      SUNCLY_LOCAL_AUTH_SECRET: ${SUNCLY_LOCAL_AUTH_SECRET:-local-dev-secret-change-me-please}
      SUNCLY_BILLING_PROVIDER: fake
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - evidence:/var/suncly

volumes:
  pgdata:
  evidence:
