<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 560" width="1800" height="560">
  <!-- Last light. The horizon the name stands on: a dusk ground, a thin warm band at the horizon, no blue. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17130F"/><stop offset="0.55" stop-color="#2A1E14"/><stop offset="0.86" stop-color="#6E4320"/><stop offset="0.93" stop-color="#C8842B"/><stop offset="0.96" stop-color="#F2C14E"/><stop offset="0.965" stop-color="#F2C14E"/><stop offset="1" stop-color="#17130F"/></linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.96" r="0.5"><stop offset="0" stop-color="#F2C14E" stop-opacity="0.55"/><stop offset="0.4" stop-color="#C8842B" stop-opacity="0.2"/><stop offset="1" stop-color="#C8842B" stop-opacity="0"/></radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17130F" stop-opacity="0.6"/><stop offset="1" stop-color="#17130F" stop-opacity="0"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer></filter>
  </defs>
  <rect width="1800" height="560" fill="url(#sky)"/>
  <rect width="1800" height="560" fill="url(#glow)"/>
  <rect width="900" height="560" fill="url(#haze)"/>
  <!-- the horizon hairline -->
  <rect y="538" width="1800" height="1.5" fill="#F2C14E" fill-opacity="0.7"/>
  <rect y="540" width="1800" height="20" fill="#17130F"/>
  <rect width="1800" height="560" filter="url(#grain)"/>
</svg>
