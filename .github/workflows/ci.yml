name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python tasks.py install
      - name: Lint
        run: python tasks.py lint
      - name: Type-check
        run: python tasks.py typecheck
      - name: Test
        run: python tasks.py test

  database:
    name: database tests (Postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: suncly
          POSTGRES_PASSWORD: suncly-ci-only
          POSTGRES_DB: suncly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suncly -d suncly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://suncly:suncly-ci-only@localhost:5432/suncly
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python tasks.py install
      - name: Apply the migrations with psql, in order
        run: |
          for file in db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Database, store, worker and API tests
        run: python tasks.py test

  frontend:
    name: frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend
      - name: Type-check
        run: npm run typecheck --prefix frontend
      - name: Build (static export)
        run: npm run build --prefix frontend

  deploy-config:
    name: deployment configuration (validated, not applied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6,<7"
      - name: Validate manifests, compose, Terraform and the Dockerfile
        run: python deploy/validate.py
